name: Python Release

on:
  push:
    branches: [main]
    paths:
      - "pagekit-python/**"

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    defaults:
      run:
        working-directory: pagekit-python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pagekit-python/dist/
          password: ${{ secrets.PYPI_TOKEN }}
